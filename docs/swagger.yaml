host: localhost:8080
info:
  contact: {}
  description: 企业级后台管理系统接口文档，覆盖认证、用户、角色、菜单、部门、字典和审计等业务模块。
  title: Go Server 后台管理 API
  version: "1.0"
paths:
  /auth/captcha:
    get:
      description: 生成登录验证码，返回验证码 ID 和图片内容。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/captcha.GenerateResponse'
              type: object
      summary: 获取图形验证码
      tags:
      - 认证授权
  /auth/login:
    post:
      consumes:
      - application/json
      description: 使用用户名、密码和验证码完成登录，成功后返回 access_token 和 refresh_token。
      parameters:
      - description: 登录请求参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/auth.TokenResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
      summary: 用户登录
      tags:
      - 认证授权
  /auth/logout:
    post:
      consumes:
      - application/json
