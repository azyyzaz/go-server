app:
  name: "go-server"
  env: "local"

http:
  host: "0.0.0.0"
  port: "8080"
  readTimeout: "5s"
  writeTimeout: "10s"

db:
  enabled: true
  dsn: "root:root@tcp(127.0.0.1:3306)/go_server?charset=utf8mb4&parseTime=True&loc=Local"
  autoMigrate: true
  maxIdleConns: 10
  maxOpenConns: 100
  connMaxLifetime: "1h"
  connMaxIdleTime: "30m"

redis:
  enabled: true
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

log:
  level: "info"
  filename: "logs/app.log"
  maxSizeMB: 20
  maxBackups: 10
  maxAgeDays: 30
  compress: false

audit:
  enabled: true
  retentionDays: 30
  cleanupInterval: "24h"
  regionFallback: "未知"

jwt:
  secret: "change-me-in-production"
  accessTokenTTL: "24h"
  refreshTokenTTL: "168h"

file:
  storage: "local"
  maxSizeMB: 10
  avatarMaxSizeMB: 2
  allowedExts:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"
    - ".webp"
    - ".pdf"
    - ".doc"
    - ".docx"
    - ".xls"
    - ".xlsx"
    - ".ppt"
    - ".pptx"
    - ".txt"
    - ".zip"
  local:
    baseDir: "uploads"
    baseURL: "/uploads"
    avatarDir: "avatars"
    dateLayout: "2006/01/02"
  minio:
    enabled: false
    endpoint: "127.0.0.1:9000"
    accessKey: "minioadmin"
    secretKey: "minioadmin"
    bucket: "go-server"
    useSSL: false
    baseURL: ""
