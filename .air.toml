root = "."
tmp_dir = "tmp"

[build]
  # 每次文件变动先重新生成 swagger，再编译
  pre_cmd = ["swag init -g cmd/api/main.go -o docs --parseDependency --quiet"]
  cmd = "go build -o ./tmp/server.exe ./cmd/api"
  bin = "tmp\\server.exe"
  full_bin = "tmp\\server.exe"
  include_ext = ["go"]
  exclude_dir = ["tmp", "docs", "logs", "migrations"]
  delay = 500

[log]
  level = "info"

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"
